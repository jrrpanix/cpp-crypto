<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6c757d;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.connecting {
            background: #ffc107;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            margin-bottom: 30px;
            height: 80vh;
        }

        .metrics-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .main-content {
            display: contents;
        }

        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card.compact {
            padding: 15px;
        }

        .card.compact h3 {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .card.collapsible h3 {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card.collapsible h3::after {
            content: '▼';
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .card.collapsible.collapsed h3::after {
            transform: rotate(-90deg);
        }

        .card.collapsible.collapsed .card-content {
            display: none;
        }

        .card h3 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .metric {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #007bff;
        }

        .metric-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #007bff;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 3px;
        }

        .data-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .trade-item, .price-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }

        .price-item {
            border-left-color: #17a2b8;
            align-items: center;
        }

        .price-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            min-width: 150px;
        }

        .bid-price, .ask-price, .single-price {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .bid-price {
            color: #28a745;
        }

        .ask-price {
            color: #dc3545;
        }

        .single-price {
            color: #17a2b8;
        }

        .symbol {
            font-weight: bold;
            color: #495057;
        }

        .price {
            color: #28a745;
            font-weight: bold;
        }

        .time {
            font-size: 0.8rem;
            color: #6c757d;
        }

        .log-entry {
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            border-left: 3px solid #007bff;
        }

        .log-entry.info {
            background: #d1ecf1;
            border-left-color: #17a2b8;
        }

        .log-entry.success {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .log-entry.warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }

        .log-entry.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .loading {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 20px;
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar styling */
        .data-list::-webkit-scrollbar {
            width: 6px;
        }

        .data-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .data-list::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .data-list::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                height: auto;
            }

            .metrics-row {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .price-container {
                min-width: 120px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Crypto Trading Dashboard</h1>
            <div id="connectionStatus" class="connection-status">
                <div class="status-dot"></div>
                <span class="status-text">Connecting...</span>
            </div>
        </div>

        <div class="dashboard">
            <div class="metrics-row">
                <div class="card compact">
                    <h3>📊 System Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric">
                            <div id="activeSymbols" class="metric-value">-</div>
                            <div class="metric-label">Symbols</div>
                        </div>
                        <div class="metric">
                            <div id="messagesPerSec" class="metric-value">-</div>
                            <div class="metric-label">Msgs/sec</div>
                        </div>
                        <div class="metric">
                            <div id="totalMessages" class="metric-value">-</div>
                            <div class="metric-label">Total</div>
                        </div>
                        <div class="metric">
                            <div id="uptime" class="metric-value">-</div>
                            <div class="metric-label">Uptime</div>
                        </div>
                    </div>
                </div>

                <div class="card compact collapsible" id="logsCard">
                    <h3>� System Logs</h3>
                    <div class="card-content">
                        <div id="systemLogs" class="data-list" style="max-height: 120px;">
                            <div class="log-entry info">System starting up...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="card">
                    <h3>� Recent Trades</h3>
                    <div id="recentTrades" class="data-list">
                        <div class="loading">Waiting for trades...</div>
                    </div>
                </div>

                <div class="card">
                    <h3>� Price Updates</h3>
                    <div id="priceUpdates" class="data-list">
                        <div class="loading">Waiting for price updates...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
