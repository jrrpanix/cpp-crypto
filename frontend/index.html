<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Table</title>
    <!-- Google Fonts for professional typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00d4ff;
            margin: 0 0 20px 0;
            font-size: 2.5em;
            font-weight: bold;
        }

        .connection-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .connection-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 10px;
        }

        .status-connected {
            background-color: #28a745;
            color: white;
        }

        .status-disconnected {
            background-color: #dc3545;
            color: white;
        }

        .trading-table {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(26, 31, 46, 0.95);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .trading-table table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .trading-table th {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #00d4ff;
            padding: 18px 20px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 3px solid #00d4ff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .trading-table th:first-child {
            text-align: left;
        }

        .trading-table th:not(:first-child) {
            text-align: right;
        }

        .trading-table td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(52, 73, 94, 0.3);
            background-color: transparent;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .trading-table td:first-child {
            text-align: left;
        }

        .trading-table td:not(:first-child) {
            text-align: right;
        }

        .trading-table tbody tr:hover td {
            background-color: rgba(0, 212, 255, 0.05);
            transform: translateY(-1px);
        }

        .trading-table tbody tr:last-child td {
            border-bottom: none;
        }

        .symbol {
            font-weight: 600;
            color: #00d4ff;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .price {
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .positive {
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }

        .negative {
            color: #ff4757;
            text-shadow: 0 0 8px rgba(255, 71, 87, 0.3);
        }

        .spread {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #a0a8b0;
            font-weight: 500;
        }

        .last-update {
            font-size: 12px;
            color: #6c757d;
            font-weight: 400;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #6c757d;
            font-style: italic;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        .controls button {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4);
            background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
        }

        .controls button:active {
            transform: translateY(0);
        }

        .controls button:disabled {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Add professional loading animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 2s infinite;
        }

        /* Price change animations */
        @keyframes priceUp {
            0% { background-color: transparent; }
            50% { background-color: rgba(0, 255, 136, 0.2); }
            100% { background-color: transparent; }
        }

        @keyframes priceDown {
            0% { background-color: transparent; }
            50% { background-color: rgba(255, 71, 87, 0.2); }
            100% { background-color: transparent; }
        }

        .price-up {
            animation: priceUp 0.8s ease-out;
        }

        .price-down {
            animation: priceDown 0.8s ease-out;
        }

        /* Enhanced connection status */
        .connection-status {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 10px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        .connection-status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-connected::before {
            background-color: #00ff88;
            box-shadow: 0 0 6px rgba(0, 255, 136, 0.6);
        }

        .status-disconnected::before {
            background-color: #ff4757;
            box-shadow: 0 0 6px rgba(255, 71, 87, 0.6);
        }

        /* Heartbeat indicator */
        .heartbeat {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: rgba(26, 31, 46, 0.8);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9em;
        }

        .heartbeat-pulse {
            width: 12px;
            height: 12px;
            background: #6c757d;
            border-radius: 50%;
            margin-right: 8px;
            transition: all 0.3s ease;
        }

        .heartbeat.active .heartbeat-pulse {
            background: #00ff88;
            animation: heartbeatPulse 1s infinite;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        @keyframes heartbeatPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        /* Message counter */
        .message-counter {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9em;
            color: #00d4ff;
        }

        /* Data source indicator */
        .data-source-indicator {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: rgba(255, 165, 0, 0.1);
            border-radius: 20px;
            border: 2px solid rgba(255, 165, 0, 0.4);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9em;
        }

        .data-source-label {
            color: #ffa500;
            margin-right: 8px;
        }

        .data-source-text {
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }

        .data-source-indicator.live {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.4);
        }

        .data-source-indicator.live .data-source-label {
            color: #00ff88;
        }

        .data-source-indicator.demo {
            background: rgba(255, 165, 0, 0.1);
            border-color: rgba(255, 165, 0, 0.4);
        }

        .data-source-indicator.demo .data-source-label {
            color: #ffa500;
        }

        .data-source-indicator.none {
            background: rgba(108, 117, 125, 0.1);
            border-color: rgba(108, 117, 125, 0.4);
        }

        .data-source-indicator.none .data-source-label {
            color: #6c757d;
        }

        #totalMessages {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            margin-left: 8px;
        }

        /* Messages column styling */
        .message-count {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: #00d4ff;
            font-size: 13px;
        }

        /* Binance timestamp styling */
        .binance-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #ffa500;
            font-weight: 500;
        }

        .binance-time.stale {
            color: #ff4757;
        }

        .binance-time.fresh {
            color: #00ff88;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .trading-table th, 
            .trading-table td {
                padding: 12px 8px;
                font-size: 13px;
            }
            
            .controls button {
                padding: 10px 16px;
                margin: 0 4px;
                font-size: 13px;
            }
            
            .header h1 {
                font-size: 2em;
            }

            .connection-info {
                flex-direction: column;
                gap: 15px;
            }

            .connection-info > div {
                font-size: 0.8em;
            }
        }

        /* Scrollbar styling */
        .trading-table {
            scrollbar-width: thin;
            scrollbar-color: #00d4ff rgba(26, 31, 46, 0.3);
        }

        .trading-table::-webkit-scrollbar {
            width: 8px;
        }

        .trading-table::-webkit-scrollbar-track {
            background: rgba(26, 31, 46, 0.3);
        }

        .trading-table::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00d4ff, #0056b3);
            border-radius: 4px;
        }

        .trading-table::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00a8cc, #003d82);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Crypto Trading Table</h1>
        <div class="connection-info">
            <div id="connectionStatus" class="connection-status status-disconnected">Disconnected</div>
            <div id="dataSourceIndicator" class="data-source-indicator">
                <span class="data-source-label">Data Source:</span>
                <span id="dataSourceText" class="data-source-text">No Data</span>
            </div>
            <div id="heartbeat" class="heartbeat">
                <div class="heartbeat-pulse"></div>
                <span id="heartbeatText">No Activity</span>
            </div>
            <div id="messageCounter" class="message-counter">
                Total Messages: <span id="totalMessages">0</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="dashboard.toggleConnection()" id="connectBtn">Connect</button>
        <button onclick="dashboard.clearData()">Clear Data</button>
        <button onclick="window.open('dashboard.html', '_blank')">Open Dashboard</button>
    </div>

    <div class="trading-table">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Last Price</th>
                    <th>Bid Price</th>
                    <th>Ask Price</th>
                    <th>Spread</th>
                    <th>Messages</th>
                    <th>Binance Time</th>
                    <th>Last Update</th>
                </tr>
            </thead>
            <tbody id="tradingTableBody">
                <tr>
                    <td colspan="8" class="no-data">No trading data available. Click Connect to start receiving data.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="table.js"></script>
</body>
</html>
