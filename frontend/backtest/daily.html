<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Market Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 2rem;
        }
        
        .nav-links {
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            margin-right: 15px;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        
        .nav-links a:hover {
            background: #f0f0f0;
        }
        
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9rem;
        }
        
        select, input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            background: white;
        }
        
        select[multiple] {
            min-height: 120px;
        }
        
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .chart-container {
            margin: 20px 0;
            padding: 20px;
            background: #fafbfc;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        
        .status {
            margin: 15px 0;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info-bar {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 10px;
            background: #e9ecef;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #495057;
        }
        
        .help-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Daily Market Data</h1>
        
        <div class="nav-links">
            <a href="/">← Home</a>
            <a href="multisymbol.html">🎲 Multi-Symbol Backtest</a>
            <a href="single-symbol.html">📊 Single-Symbol Backtest</a>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="symbols">Select Symbols:</label>
                <select id="symbols" multiple>
                    <!-- Populated by JavaScript -->
                </select>
                <div class="help-text">Hold Ctrl/Cmd to select multiple</div>
            </div>
            
            <div class="control-group">
                <label for="dateRange">Date Range:</label>
                <select id="dateRange">
                    <option value="all">All Available Data</option>
                    <option value="1m">Last Month</option>
                    <option value="3m">Last 3 Months</option>
                    <option value="6m">Last 6 Months</option>
                    <option value="1y">Last Year</option>
                </select>
            </div>
            
            <button id="loadBtn" onclick="loadData()">Load Data</button>
        </div>
        
        <div id="status"></div>
        <div id="info" class="info-bar" style="display: none;"></div>
        
        <div class="chart-container">
            <h3 style="margin: 0 0 15px 0; color: #333;">Daily Closing Prices</h3>
            <div class="chart-wrapper">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
        
        <div class="chart-container">
            <h3 style="margin: 0 0 15px 0; color: #333;">Daily Volume</h3>
            <div class="chart-wrapper">
                <canvas id="volumeChart"></canvas>
            </div>
        </div>
    </div>
    
    <script src="daily.js"></script>
</body>
</html>
