[project]
name = "binance-data-tools"
version = "0.1.0"
description = "Tools for downloading and processing Binance market data"
requires-python = ">=3.12"

dependencies = [
    "polars",
    "pandas",
    "matplotlib",
    "requests",
    "rich",
    "fastapi",
    "uvicorn[standard]",
    "plotly>=6.3.0",
    "kaleido>=1.0.0",
    "mplfinance>=0.12.10b0",
    "pyarrow>=21.0.0",
    "scipy>=1.16.2",
]


