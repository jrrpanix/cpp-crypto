services:
  backtest-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: backtest-api
    ports:
      - "5001:5000"
    volumes:
      # Mount data directory for parquet access (configurable via DATA_DIR env var)
      - ${DATA_DIR:-../data}:/app/data:ro
      # Mount writable directory for backtest results
      - ${DATA_DIR:-../data}/backtest_results:/app/backtest_results:rw
      # Mount source for live development
      - ../server/backtest_api.py:/app/backtest_api.py
      - ../src/research/signal_utils:/app/signal_utils:ro
      # Mount frontend files so Flask can serve them
      - ../frontend/backtest:/app/frontend/backtest:ro
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      # Try both common data directory structures
      - DATA_PATH=/app/data/kline_aggregate:/app/data/aggregate_parquet:/app/data/klines
    networks:
      - backtest-network

networks:
  backtest-network:
    driver: bridge
