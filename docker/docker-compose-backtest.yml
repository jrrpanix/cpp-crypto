services:
  backtest-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: backtest-api
    ports:
      - "5001:5000"
    volumes:
      # Mount data directory for parquet access (configurable via DATA_DIR env var)
      - ${DATA_DIR:-../data}:/app/data:ro
      # Mount source for live development
      - ../server/backtest_api.py:/app/backtest_api.py
      - ../src/research/signal_utils:/app/signal_utils:ro
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      # Try both common data directory structures
      - DATA_PATH=/app/data/kline_aggregate:/app/data/aggregate_parquet:/app/data/klines
    networks:
      - backtest-network

  backtest-frontend:
    image: nginx:alpine
    container_name: backtest-frontend
    ports:
      - "8084:80"
    volumes:
      - ../frontend/backtest/index.html:/usr/share/nginx/html/index.html:ro
      - ../frontend/backtest/backtest.js:/usr/share/nginx/html/backtest.js:ro
    networks:
      - backtest-network

networks:
  backtest-network:
    driver: bridge
