services:
  consumer:
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
    container_name: consumer
    networks:
      - market-net
    command: /workspace/apps/bin/consumer_main --sendweb
    volumes:
      - .:/workspace

  producer:
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
    container_name: producer
    depends_on:
      - consumer
    networks:
      - market-net
    volumes:
      - .:/workspace
    command: /workspace/apps/bin/mock_binance_main


  webserver:
    build:
      context: .                          # repo root
      dockerfile: docker/webserver/Dockerfile
    container_name: fastapi-server
    networks:
      - market-net
    volumes:
      - ./server:/app                     # mount code where the Dockerfile expects it
    ports:
      - "8000:8000"

networks:
  market-net:

