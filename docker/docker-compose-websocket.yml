services:
  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    container_name: consumer-websocket
    networks:
      - market-net
    command: /app/bin/consumer_ws_main --websocket --port 9001
    ports:
      - "9001:9001"  # WebSocket server port
    # Mount config directory so binaries can find their config files
    volumes:
      - ../apps/config:/workspace/apps/config:ro

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    container_name: producer
    depends_on:
      - consumer
    networks:
      - market-net
    command: /app/bin/mock_binance_main --throttle 100 --variation 0.002 --shock-prob 0.03 --shock-mag 0.008
    environment:
      - PRODUCER_THROTTLE_MS=100
      - PRODUCER_VARIATION=0.002
      - PRODUCER_SHOCK_PROB=0.03
      - PRODUCER_SHOCK_MAG=0.008
    # Mount data, config, and test_data directories
    volumes:
      - ../data:/workspace/data:ro
      - ../apps/config:/workspace/apps/config:ro
      - ../test_data:/workspace/test_data:ro

  # Simple HTTP server for serving static frontend files
  webserver:
    image: nginx:alpine
    container_name: frontend-server
    ports:
      - "8082:80"  # Use port 8082 to avoid conflicts
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    networks:
      - market-net

networks:
  market-net: