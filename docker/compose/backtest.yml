services:
  backtest-api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.backtest
    container_name: backtest-api
    ports:
      - "8084:5000"
    volumes:
      # Mount data directory for parquet access (configurable via DATA_DIR env var)
      - ${DATA_DIR:-../../data}:/app/data:ro
      # Mount writable directory for backtest results
      - ${DATA_DIR:-../../data}/backtest_results:/app/backtest_results:rw
      # Mount source for live development
      - ../../python/backtest/api:/app/api
      - ../../python/research/signal_utils:/app/signal_utils:ro
      # Mount frontend files so Flask can serve them
      - ../../python/backtest/frontend:/app/frontend:ro
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DATA_PATH=/app/data/klines_aggregate:/app/data/klines_daily
    working_dir: /app/api
    command: python backtest_api.py
    networks:
      - backtest-network

networks:
  backtest-network:
    driver: bridge
