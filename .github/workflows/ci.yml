name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and cache development image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/Dockerfile.dev
        push: true
        load: true
        tags: ghcr.io/${{ github.repository_owner }}/cpp-crypto-dev:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cpp-crypto-dev-cache:latest
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cpp-crypto-dev-cache:latest,mode=max

    - name: Start development container
      run: make dev DEV_IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/cpp-crypto-dev:latest

    - name: Verify Dependency Installation
      run: |
        echo "--- Verifying contents of /opt/cpp-crypto-deps/include ---"
        docker exec cpp-crypto-dev-container ls -l /opt/cpp-crypto-deps/include
        echo "--- Verifying contents of /opt/cpp-crypto-deps/lib ---"
        docker exec cpp-crypto-dev-container ls -l /opt/cpp-crypto-deps/lib

    - name: Build code
      run: |
        docker exec cpp-crypto-dev-container bash -x ./scripts/build/binance_build.sh
        docker exec cpp-crypto-dev-container bash -x ./scripts/build/consumer_build.sh

    - name: Run tests
      run: make test
