name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and cache development image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/Dockerfile.dev
        push: true
        load: true
        tags: cpp-crypto-dev:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cpp-crypto-dev-cache:latest
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cpp-crypto-dev-cache:latest,mode=max

    - name: Start development container
      run: make run-dev

    - name: Install dependencies
      run: make deps

    - name: Build code
      run: |
        docker exec cpp-crypto-dev-container bash -x ./scripts/build/binance_build.sh
        docker exec cpp-crypto-dev-container bash -x ./scripts/build/consumer_build.sh

    - name: Run tests
      run: make test
