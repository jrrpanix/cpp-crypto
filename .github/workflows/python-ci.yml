name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**/*.py'
      - 'python/pyproject.toml'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**/*.py'
      - 'python/pyproject.toml'
      - '.github/workflows/python-ci.yml'

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: |
        curl -Ls https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        cd python && uv pip install --system -e ".[dev]"
    
    - name: Check code formatting with Black
      run: |
        echo "Checking Python code formatting with Black..."
        black --check --diff python/research python/backtest || echo "::warning::Code needs formatting. Run 'make format' locally or create a PR for auto-formatting."
    
    - name: Lint with Ruff
      run: |
        echo "Linting Python code with Ruff..."
        ruff check python/research python/backtest || echo "::warning::Code has linting issues. Run 'make format' locally or create a PR for auto-fixing."
    
    - name: Run tests
      if: always()
      run: |
        echo "Running Python tests..."
        if [ -d "python/research/tests" ] && [ "$(ls -A python/research/tests/test_*.py 2>/dev/null)" ]; then
          pytest python/research/tests
        else
          echo "No tests found, skipping..."
        fi
  
  auto-format:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint-and-format
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: |
        curl -Ls https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv pip install --system black ruff
    
    - name: Auto-format with Black
      run: |
        black python/research python/backtest
    
    - name: Auto-fix with Ruff
      run: |
        ruff check --fix python/research python/backtest || true
    
    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: auto-format Python code with Black and Ruff"
        file_pattern: "python/**/*.py"
